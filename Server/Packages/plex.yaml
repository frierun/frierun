name: "plex"
url: "https://github.com/plexinc/pms-docker/"
shortDescription: "Personal media server"
fullDescription: "Plex gives you one place to find and access all the media that matters to you.
    From personal media on your own server, to free and on-demand Movies & Shows or live TV,
    to streaming music, you can enjoy it all in one app, on any device."
tags: [ "storage" ]
contracts:
  Container:
    imageName: "plexinc/pms-docker:latest"
    env:
      PLEX_CLAIM: "{{Parameter:PlexClaim:Value}}"
    mounts:
      /config: "database"
      /transcode: "transcode"
      /data: "media"

  HttpEndpoint:
    port: 32400

  PortEndpoint:8324:
    port: 8324
    protocol: "tcp"

  PortEndpoint:32469:
    port: 32469
    protocol: "tcp"

  PortEndpoint:1900:
    port: 1900
    protocol: "udp"

  PortEndpoint:32410:
    port: 32410
    protocol: "udp"

  PortEndpoint:32412:
    port: 32412
    protocol: "udp"

  PortEndpoint:32413:
    port: 32413
    protocol: "udp"

  PortEndpoint:32414:
    port: 32414
    protocol: "udp"