name: "frierun"
url: "https://github.com/frierun/frierun"
iconUrl: "/packages/frierun.png"
contracts:
  Container:
    imageName: "ghcr.io/frierun/frierun:latest"
    mounts:
      /App/Frierun: "config"
    
  Optional:Docker socket:
    name: "Docker socket"
    contracts:
      Container:
        mountDockerSocket: true
    
  HttpEndpoint:
    port: 8080